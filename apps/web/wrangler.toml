name = "gspb-cs"
main = ".open-next/worker.js"
compatibility_date = "2026-10-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 0.05

[limits]
cpu_ms = 30_000

[[d1_databases]]
binding = "DB"
database_name = "gspb-classes"
database_id = "31553b22-ab9c-4c2e-91c6-53a6e5d6b090"

[[services]]
binding = "RUNNER"
service = "gspb-runner"

[vars]
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuZ3NwYi5jb2RlcyQ"
NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/sign-in"
NEXT_PUBLIC_CLERK_SIGN_UP_URL = "/sign-up"
NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL = "/dashboard"
NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL = "/dashboard"
NEXT_PUBLIC_SITE_URL = "https://gspb.codes"
NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL = "/classes"
NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL = "/classes"
NEXT_PUBLIC_CLERK_SIGN_IN_FORCE_REDIRECT_URL = "/classes"
NEXT_PUBLIC_CLERK_SIGN_UP_FORCE_REDIRECT_URL = "/classes"

[[routes]]
pattern = "gspb.codes"
custom_domain = true
